name: Azure SQL · histórico

# Copia una vez al día el histórico horario de data/historico (lo llena el Robot,
# historico.yml) a la base Azure SQL gratuita, donde las Views de azure/schema.sql
# quedan listas para Excel, Power BI o SQL. No publica nada en el repositorio.
# Mientras no existan los secrets AZURE_SQL_*, solo avisa que no está configurado.
# Guía: azure/LEEME.md
on:
  schedule:
    - cron: '20 12 * * *'   # 06:20 hora centro de México
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar cliente de SQL Server
        run: npm install --no-save --no-package-lock --ignore-scripts mssql@12.7.4

      - name: Sincronizar con Azure SQL
        env:
          AZURE_SQL_SERVER: ${{ secrets.AZURE_SQL_SERVER }}
          AZURE_SQL_DATABASE: ${{ secrets.AZURE_SQL_DATABASE }}
          AZURE_SQL_USER: ${{ secrets.AZURE_SQL_USER }}
          AZURE_SQL_PASSWORD: ${{ secrets.AZURE_SQL_PASSWORD }}
        run: node scripts/sync-azure.mjs
