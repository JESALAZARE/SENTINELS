name: Histórico de precios

# Robot del histórico horario (Market Prices · "Long-term history"): carga poco a poco,
# desde 2016, los NodosP y Zonas de Carga de scripts/historico-lista.json y cada día agrega
# los días nuevos (scripts/fetch-historico.mjs). Cuando todo está completo, cada corrida
# hace solo unas cuantas llamadas al CENACE y no publica nada si no hubo cambios.
on:
  schedule:
    - cron: '41 * * * *'   # cada hora
  workflow_dispatch:
    inputs:
      llamadas:
        description: 'Máximo de llamadas al CENACE en esta corrida'
        default: '300'

permissions:
  contents: write

# Mismo grupo que pml.yml: los dos publican en el repositorio, uno a la vez
concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cargar histórico
        run: node scripts/fetch-historico.mjs --llamadas "${{ github.event.inputs.llamadas || '300' }}" --minutos 22

      - name: Publicar cambios
        if: always()
        run: |
          git add data/historico
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Datos: histórico de precios $(TZ=America/Mexico_City date '+%F %H:%M')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
