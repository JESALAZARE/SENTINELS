name: PML CENACE

# Descarga diaria de Precios Marginales Locales (scripts/fetch-pml.mjs) y del
# tipo de cambio FIX para pagos de Banxico (scripts/fetch-fx.mjs).
on:
  schedule:
    - cron: '0 13 * * *'   # 07:00 hora centro de México (tipo de cambio del día)
    - cron: '0 23 * * *'   # 17:00 hora centro de México (MDA del día siguiente)
    - cron: '0 4 * * *'    # 22:00 hora centro de México (reintento)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pml
  cancel-in-progress: false

jobs:
  pml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Descargar PML
        run: node scripts/fetch-pml.mjs

      - name: Descargar tipo de cambio (Banxico)
        if: always()
        run: node scripts/fetch-fx.mjs

      - name: Publicar cambios
        if: always()
        run: |
          git add data/pml data/fx
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Datos: PML CENACE $(TZ=America/Mexico_City date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
