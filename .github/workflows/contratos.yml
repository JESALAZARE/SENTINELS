name: Contratos de Cobertura CENACE

# Descarga los Contratos de Cobertura Eléctrica que publica el CENACE
# (scripts/fetch-contratos.mjs). El archivo vive en el bucket privado de Cloudflare R2,
# como los demás datos de mercado; el portal lo lee por el Worker de precios
# (pml-worker/LEEME.md). Si la validación del script falla, el workflow queda en rojo
# y el bucket conserva el archivo anterior.
on:
  schedule:
    - cron: '30 13 * * *'  # 07:30 hora centro de México
    - cron: '30 1 * * *'   # 19:30 hora centro de México (contratos aceptados durante el día)
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Aceptar una baja grande de folios (solo si se revisó que es real)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: contratos
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_MERCADO_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_MERCADO_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2: s3://${{ secrets.R2_MERCADO_BUCKET }}

jobs:
  contratos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Traer el archivo anterior del bucket R2
        run: aws s3 sync "$R2/contratos" data/contratos --only-show-errors

      - name: Descargar contratos
        run: node scripts/fetch-contratos.mjs ${{ inputs.forzar && '--forzar' || '' }}

      - name: Subir al bucket R2
        run: aws s3 cp data/contratos/contratos.json "$R2/contratos/contratos.json" --content-type application/json --only-show-errors
